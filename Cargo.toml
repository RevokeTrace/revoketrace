[package]
name = "revoketrace-spike"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Read-only Stellar Classic authorization change forecasting CLI"
repository = "https://github.com/RevokeTrace/revoketrace"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stellar-xdr = { version = "28.0.1", features = ["std", "base64"] }
sha2 = "0.10.9"
hex = "0.4.3"
