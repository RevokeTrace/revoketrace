name: Documentation

on:
  pull_request:
    paths:
      - 'book.toml'
      - 'book/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'book.toml'
      - 'book/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Install pinned mdBook
        run: cargo install mdbook --version 0.4.52 --locked
      - name: Build book
        run: mdbook build
      - name: Upload book
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/output

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
